# ==========================================
# Workstation Bootstrap Configuration
# ==========================================

# Global settings

bootstrap:
  version: "1.0"


# ==========================================
# Modules
# ==========================================

modules:

  # Base operating system packages
  system_packages: true

  # Container runtime
  docker: true

  # AWS tooling
  aws: true

  # Microsoft Azure tooling
  azure: true

  # Infrastructure as Code
  hashicorp: true

  # Kubernetes ecosystem
  kubernetes: true

  # Terminal customization
  terminal: true

  # Security tools
  security: true


# ==========================================
# Platform options
# ==========================================

platform:

  linux:
    package_manager: native

  macos:
    package_manager: homebrew

